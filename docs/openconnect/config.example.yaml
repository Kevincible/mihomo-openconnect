# Replace example credentials locally. Do not commit real passwords/cookies/TOTP secrets.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: OPENCONNECT
    type: openconnect
    server: vpn.example.com
    port: 443
    username: your-username
    password: your-password
    # auth-group: employees
    # cookie: supplied-by-your-host
    # totp-secret: BASE32_SECRET
    # ca: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----
    # certificate and private-key accept inline PEM for client certificate authentication.
    skip-cert-verify: false
    udp: true
    dtls: true
    ipv6: false
    connect-timeout: 30
    reconnect-timeout: 300
    ip-stack:
      mode: gvisor
    # interface-name: en0
    # dialer-proxy: GATEWAY-PROXY

proxy-groups:
  - name: COMPANY
    type: select
    proxies: [OPENCONNECT]

# Replace these documentation addresses with your existing company DNS and rules.
# Keep proxy-server-nameserver independent of the VPN to bootstrap the gateway.
dns:
  enable: true
  listen: 127.0.0.1:1053
  nameserver: [1.1.1.1]
  proxy-server-nameserver: [1.1.1.1]
  nameserver-policy:
    '+.corp.example': '192.0.2.53#OPENCONNECT'

rules:
  - DOMAIN-SUFFIX,corp.example,COMPANY
  - IP-CIDR,192.0.2.0/24,COMPANY,no-resolve
  - MATCH,DIRECT
